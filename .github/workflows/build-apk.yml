name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Clean & Recreate Android Project
        run: |
          rm -rf android
          flutter create --project-name aasan_ai --org com.example.aasan_ai --platforms=android .

      - name: Update Kotlin Gradle Plugin
        run: |
          python3 - << 'EOF'
          import os, re

          settings_path = "android/settings.gradle"
          if os.path.exists(settings_path):
              with open(settings_path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(
                  r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+(")',
                  r'\g<1>2.2.0\2',
                  s,
              )
              s = re.sub(
                  r"(id\s+'org\.jetbrains\.kotlin\.android'\s+version\s+')[^']+(')",
                  r"\g<1>2.2.0\2",
                  s,
              )
              with open(settings_path, "w", encoding="utf-8") as f:
                  f.write(s)

          build_path = "android/build.gradle"
          if os.path.exists(build_path):
              with open(build_path, "r", encoding="utf-8") as f:
                  b = f.read()
              b = re.sub(
                  r"(ext\.kotlin_version\s*=\s*['\"])[^'\"]+(['\"])",
                  r"\g<1>2.2.0\2",
                  b,
              )
              with open(build_path, "w", encoding="utf-8") as f:
                  f.write(b)
          EOF

      - name: Set Android SDK 36 and minSdk 24
        run: |
          python3 - << 'EOF'
          import os, re

          for app_gradle in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(app_gradle):
                  with open(app_gradle, "r", encoding="utf-8") as f:
                      g = f.read()
                  g = re.sub(r"(compileSdk\s*=?\s*)\d+", r"\g<1>36", g)
                  g = re.sub(r"(compileSdkVersion\s+)\d+", r"\g<1>36", g)
                  g = re.sub(r"(minSdkVersion\s+)\d+", r"\g<1>24", g)
                  g = re.sub(r"(minSdk\s*=?\s*)\d+", r"\g<1>24", g)
                  with open(app_gradle, "w", encoding="utf-8") as f:
                      f.write(g)
          EOF

      - name: Configure AndroidManifest
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application"""

          if "android.permission.RECORD_AUDIO" not in content and "<application" in content:
              content = content.replace("<application", perms, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
