name: Flutter APK Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Clean & Recreate Android Project
        run: |
          rm -rf android
          flutter create --project-name aasan_ai --org com.example.aasan_ai --platforms=android .

      - name: Configure AndroidManifest Permissions & Queries
        run: python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              s = f.read()
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace("<manifest ", "<manifest ", 1)
              s = s.replace("<application", "    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\n    <queries>\n        <intent>\n            <action android:name=\"android.intent.action.TTS_SERVICE\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n    </queries>\n\n    <application", 1)
          with open(p, "w", encoding="utf-8") as f:
              f.write(s)
        '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
